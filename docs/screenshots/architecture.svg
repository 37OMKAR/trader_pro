<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="archbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="webg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="apig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="agentg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="svcg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#archbg)"/>
  <text x="40" y="42" fill="#f8fafc" font-size="22" font-weight="700">System Architecture</text>
  <text x="40" y="62" fill="#94a3b8" font-size="12">6-tier stack · Async FastAPI gateway · Multi-agent Hermes brain · 14 domain engines</text>

  <!-- Tier 1 Users -->
  <rect x="40" y="90" width="1120" height="60" rx="10" fill="#111827" stroke="#1f2937"/>
  <text x="60" y="126" fill="#94a3b8" font-size="12">USERS</text>
  <g font-size="13" fill="#f8fafc">
    <rect x="140" y="104" width="140" height="32" rx="16" fill="#1e293b"/>
    <text x="160" y="124">🌐 Web Dashboard</text>
    <rect x="300" y="104" width="140" height="32" rx="16" fill="#1e293b"/>
    <text x="320" y="124">⌨️  Hermes CLI</text>
    <rect x="460" y="104" width="140" height="32" rx="16" fill="#1e293b"/>
    <text x="480" y="124">📱 Telegram Bot</text>
    <rect x="620" y="104" width="140" height="32" rx="16" fill="#1e293b"/>
    <text x="640" y="124">🔊 Voice/Avatar</text>
  </g>

  <!-- Tier 2 Web -->
  <rect x="40" y="170" width="1120" height="70" rx="10" fill="url(#webg)" opacity="0.9"/>
  <text x="60" y="196" fill="#dbeafe" font-size="12" font-weight="700">PRESENTATION · apps/web</text>
  <text x="60" y="222" fill="#f8fafc" font-size="14">Next.js 15 · React 19 · Tailwind · Recharts · 22 feature components</text>

  <!-- Tier 3 API -->
  <rect x="40" y="260" width="1120" height="90" rx="10" fill="url(#apig)" opacity="0.9"/>
  <text x="60" y="286" fill="#d1fae5" font-size="12" font-weight="700">GATEWAY · apps/api · FastAPI 0.115</text>
  <g font-size="11" fill="#f8fafc">
    <text x="60" y="312">market · derivatives · strategies · paper_trading · tournaments · portfolio_risk</text>
    <text x="60" y="332">evolution · research · alerts · voice · skills · telegram · tutor · agent_activity</text>
  </g>

  <!-- Tier 4 Hermes + Services (side by side) -->
  <rect x="40" y="370" width="548" height="140" rx="10" fill="url(#agentg)" opacity="0.9"/>
  <text x="60" y="396" fill="#ede9fe" font-size="12" font-weight="700">HERMES MULTI-AGENT · agents/</text>
  <g font-size="11" fill="#f8fafc">
    <text x="60" y="422">4 Analysts · 2 Researchers · 3 Debators</text>
    <text x="60" y="442">Trader · Risk Mgr · Portfolio Mgr</text>
    <text x="60" y="462">Reflection · Reporting · 12-Skill Registry</text>
    <text x="60" y="488" font-size="10">orchestrator.py → hermes_brain.py → llm_provider.py</text>
  </g>

  <rect x="612" y="370" width="548" height="140" rx="10" fill="url(#svcg)" opacity="0.9"/>
  <text x="632" y="396" fill="#fef3c7" font-size="12" font-weight="700">DOMAIN SERVICES · services/</text>
  <g font-size="11" fill="#f8fafc">
    <text x="632" y="422">alert · backtest · feature · prediction · regime</text>
    <text x="632" y="442">paper_trading · portfolio_intelligence · research</text>
    <text x="632" y="462">strategy_dsl · strategy_evolution · tournament</text>
    <text x="632" y="488" font-size="10">voice · market_tutor · notification_connectors</text>
  </g>

  <!-- Tier 5 Packages -->
  <rect x="40" y="528" width="1120" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="554" fill="#cbd5e1" font-size="12" font-weight="700">SHARED PACKAGES · packages/</text>
  <g font-size="12" fill="#f8fafc">
    <rect x="60" y="568" width="200" height="28" rx="14" fill="#0f172a"/>
    <text x="76" y="586">📈 derivatives_engine</text>
    <rect x="276" y="568" width="200" height="28" rx="14" fill="#0f172a"/>
    <text x="292" y="586">🗓  market_calendar</text>
    <rect x="492" y="568" width="200" height="28" rx="14" fill="#0f172a"/>
    <text x="508" y="586">📡 market_data</text>
    <rect x="708" y="568" width="200" height="28" rx="14" fill="#0f172a"/>
    <text x="724" y="586">🧬 shared_types</text>
  </g>

  <!-- Tier 6 Data -->
  <rect x="40" y="628" width="1120" height="70" rx="10" fill="url(#dbg)" opacity="0.9"/>
  <text x="60" y="654" fill="#ffe4e6" font-size="12" font-weight="700">PERSISTENCE</text>
  <g font-size="12" fill="#f8fafc">
    <text x="60" y="680">SQLite (dev) · TimescaleDB (prod) · SQLAlchemy 2.1 async · 14 ORM models</text>
    <text x="60" y="696" font-size="11" fill="#fecdd3">yfinance · TinyFish web intel · NSE/BSE live feeds</text>
  </g>

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <line x1="600" y1="150" x2="600" y2="170" marker-end="url(#arrow)"/>
    <line x1="600" y1="240" x2="600" y2="260" marker-end="url(#arrow)"/>
    <line x1="314" y1="350" x2="314" y2="370" marker-end="url(#arrow)"/>
    <line x1="886" y1="350" x2="886" y2="370" marker-end="url(#arrow)"/>
    <line x1="600" y1="510" x2="600" y2="528" marker-end="url(#arrow)"/>
    <line x1="600" y1="608" x2="600" y2="628" marker-end="url(#arrow)"/>
  </g>
</svg>
